{% load static %} 
<!doctype html> 
<html lang="es"> 
<head> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <meta name="author" content="Untree.co"> 
    <link rel="shortcut icon" href="{% static 'favicon.png' %}"> 
    <meta name="description" content="Blog Canaco" /> 
    <meta name="keywords" content="blog, django, bootstrap" /> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet"> 
    
    <link rel="stylesheet" href="{% static 'fonts/icomoon/style.css' %}"> 
    <link rel="stylesheet" href="{% static 'fonts/flaticon/font/flaticon.css' %}"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"> 
    <link rel="stylesheet" href="{% static 'css/tiny-slider.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/aos.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/glightbox.min.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> 
    <link rel="stylesheet" href="{% static 'css/flatpickr.min.css' %}"> 
    
    <title>{% block title %}Canaco{% endblock %}</title> 

    <style>
        :root {
            --primary-blue: #176b68;
            --hover-blue: #115653;
            --light-blue: #e7f2ef;
            --ink: #19333a;
            --muted: #718187;
            --surface: #f5f7f6;
            --bs-orange: #176b68;
            --bs-warning: #176b68;
            --bs-warning-rgb: 23, 107, 104;
        }

        body {
            color: var(--ink);
            background: var(--surface);
        }

        .btn, .form-control, .form-select {
            border-radius: .65rem !important;
        }

        .menu-bg-wrap {
            background: #173a40 !important;
            border-radius: 1rem;
            box-shadow: 0 12px 30px rgba(18, 50, 56, .12);
        }

        .site-footer {
            background: linear-gradient(112deg, #061a36 0%, #08284a 62%, #0b4670 100%) !important;
            color: rgba(255, 255, 255, .76);
        }

        .bg-primary, .btn-primary, .panel-logout-button {
            background-color: var(--primary-blue) !important;
            border-color: var(--primary-blue) !important;
            color: #ffffff !important;
        }

        .btn-primary:hover, .btn-danger:hover {
            background-color: var(--hover-blue) !important;
            border-color: var(--hover-blue) !important;
        }

        .btn-outline-light:hover {
            color: var(--primary-blue) !important;
        }

        a { color: var(--primary-blue); }
        a:hover { color: var(--hover-blue); text-decoration: none; }
        .posts-entry-title, h1, h2, h3, h4 { color: var(--ink) !important; }

        .site-nav .site-navigation .site-menu > li > a {
            color: rgba(255, 255, 255, .82) !important;
        }

        .site-nav .site-navigation .site-menu > li.active > a,
        .site-nav .site-navigation .site-menu > li > a:hover {
            color: #ffffff !important;
        }

        .site-footer a, .site-footer p, .site-footer span, .site-footer .text-white-50 {
            color: rgba(255, 255, 255, .76) !important;
        }

        .site-footer h3 {
            color: #ffffff !important;
        }

        .site-footer a:hover {
            color: #ffffff !important;
        }
    </style>
</head> 
<body> 
 
    {% include 'partials/header.html' %} 
    
    {% block content %} 
    {% endblock content %} 
    
    {% include 'partials/footer.html' %} 
    
    <div id="overlayer"></div> 
    <div class="loader"> 
        <div class="spinner-border text-primary" role="status"> 
            <span class="visually-hidden">Loading...</span> 
        </div> 
    </div> 
    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script> 
    <script src="{% static 'js/tiny-slider.js' %}"></script> 
    <script src="{% static 'js/flatpickr.min.js' %}"></script> 
    <script src="{% static 'js/aos.js' %}"></script> 
    <script src="{% static 'js/glightbox.min.js' %}"></script> 
    <script src="{% static 'js/navbar.js' %}"></script> 
    <script src="{% static 'js/counter.js' %}"></script> 
    <script src="{% static 'js/custom.js' %}"></script> 
</body> 
</html>

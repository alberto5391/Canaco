{% load static %}

{% with current=request.resolver_match.url_name %}
<aside class="panel-sidebar flex-shrink-0">
    <ul class="nav nav-pills nav-flush flex-column mb-auto text-start">

        <li class="nav-item">
            <a href="{% url 'home:perfil' %}"
               class="nav-link panel-nav-link
               {% if current == 'perfil' or current == 'crud_perfil' %}
                   active
               {% endif %}">
                <i class="bi bi-person-fill" aria-hidden="true"></i>
                <span>Mi Perfil</span>
            </a>
        </li>

        <li>
            <a href="{% url 'home:crud_noticias' %}"
               class="nav-link panel-nav-link
               {% if current == 'crud_noticias' or current == 'crear_publicacion' %}
                   active
               {% endif %}">
                <i class="bi bi-file-earmark-text-fill" aria-hidden="true"></i>
                <span>Noticias</span>
            </a>
        </li>

        <li>
            <a href="{% url 'home:crud_comentarios' %}"
               class="nav-link panel-nav-link
               {% if current == 'crud_comentarios' %}
                   active
               {% endif %}">
                <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
                <span>Comentarios</span>
            </a>
        </li>

        <li>
            <a href="{% url 'home:crud_categorias' %}"
               class="nav-link panel-nav-link
               {% if current == 'crud_categorias' or current == 'editar_categoria' %}
                   active
               {% endif %}">
                <i class="bi bi-list-ul" aria-hidden="true"></i>
                <span>Categorías</span>
            </a>
        </li>

        <li>
            <a href="{% url 'home:crud_usuarios' %}"
               class="nav-link panel-nav-link
               {% if current == 'crud_usuarios' or current == 'crear_usuario' %}
                   active
               {% endif %}">
                <i class="bi bi-people-fill" aria-hidden="true"></i>
                <span>Usuarios</span>
            </a>
        </li>

        <li>
            <a href="{% url 'home:crud_cambiar_contrasena' %}"
               class="nav-link panel-nav-link
               {% if current == 'crud_cambiar_contrasena' %}
                   active
               {% endif %}">
                <i class="bi bi-key-fill" aria-hidden="true"></i>
                <span>
                    Cambiar<br>
                    contraseña
                </span>
            </a>
        </li>

        <li>
            <form method="post"
                  action="{% url 'home:logout' %}"
                  class="w-100">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger panel-logout-button w-100">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </li>

    </ul>
</aside>
{% endwith %}
